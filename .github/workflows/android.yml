
name: Build Reshanara AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RESHANARA_AI_A03s_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip RESHANARA_AI_A03s_CloudBuild.zip -d .

      - name: Build APK
        run: gradle -p reshanara_android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reshanara-AI-APK
          path: reshanara_android_project/app/build/outputs/apk/debug/app-debug.apk
